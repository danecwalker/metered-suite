# Harbor-shaped task. Agent never sees tests/.
# Grading is a separate verifier container (DeepSWE v1.1 / Pier).

[task]
name = "rate-limit"
language = "python"
allow_internet = false

[agent]
timeout_sec = 1200

[verifier]
timeout_sec = 120
network = "none"

[[verifier.collect]]
kind = "git-diff"
from = "HEAD"
output = "changes.patch"
