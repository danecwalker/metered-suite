[project]
name = "metered-suite"
version = "0.3.0"
description = "Official Metered jobs. Run python3 -m metered_suite init, then python3 -m metered_suite <harness> --model <sku>."
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
metered-suite = "metered_suite.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metered_suite*"]
