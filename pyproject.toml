[project]
name = "metered-suite"
version = "0.3.0"
description = "Official Metered jobs. Clone, edit main.py, run your harness."
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
metered-suite = "metered_suite.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metered_suite*"]
